ist\">\u003cbutton class=\"on\" data-t=\"pz\">معما\u003c/button>\u003cbutton data-t=\"dy\">چالش روزانه\u003c/button>\u003cbutton data-t=\"pr\">پیشرفت\u003c/button>\u003c/div>\u003c/nav>\n\u003cscript>\nvar K='prism-mind-';\n\nvar $=function(s){return document.querySelector(s)},$$=function(s){return document.querySelectorAll(s)};\nfunction ls(k,d){try{var v=localStorage.getItem(K+k);return v?JSON.parse(v):d}catch(e){return d}}\nfunction sv(k,v){try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){}}\nfunction p2(n){return(n\u003c10?'0':'')+n}\nfunction esc(s){return String(s).replace(/[&\u003c>\"]/g,function(c){return{'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}\nvar t0=ls('theme',null);if(t0)document.documentElement.dataset.theme=t0;\n$('#theme').onclick=function(){var r=document.documentElement,c=r.dataset.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');r.dataset.theme=c==='dark'?'light':'dark';sv('theme',r.dataset.theme)};\nvar tabs=$$('nav button');\nfunction go(t){tabs.forEach(function(x){x.classList.toggle('on',x.dataset.t===t)});$$('.tab').forEach(function(e){e.classList.toggle('on',e.id===t)});if(window.onTab)onTab(t)}\ntabs.forEach(function(b){b.onclick=function(){go(b.dataset.t)}});\n\n\nvar P=[\n{c:'الگو',d:1,q:'عدد بعدی دنباله را پیدا کن:\u003cbr>\u003cspan dir=\"ltr\" class=\"seq\">2, 6, 12, 20, 30, ?\u003c/span>',o:['40','42','44','36'],a:1,h:['فاصله‌ی بین جمله‌های پشت‌سرهم را حساب کن.','فاصله‌ها 4، 6، 8 و 10 هستند. الگوی فاصله‌ها چیست؟'],s:'فاصله‌ها هر بار 2 واحد بیشتر می‌شوند: 4، 6، 8، 10 و بعدی 12. پس 30 + 12 = 42.'},\n{c:'الگو',d:1,q:'عدد بعدی چیست؟\u003cbr>\u003cspan dir=\"ltr\" class=\"seq\">1, 1, 2, 3, 5, 8, ?\u003c/span>',o:['11','12','13','15'],a:2,h:['به رابطه‌ی هر جمله با دو جمله‌ی قبلش نگاه کن.'],s:'هر جمله جمع دو جمله‌ی قبلی است (دنباله‌ی فیبوناچی): 5 + 8 = 13.'},\n{c:'الگو',d:2,q:'عدد بعدی چیست؟\u003cbr>\u003cspan dir=\"ltr\" class=\"seq\">3, 6, 11, 18, 27, ?\u003c/span>',o:['36','38','40','45'],a:1,h:['فاصله‌ی جمله‌ها را بنویس.','فاصله‌ها اعداد فرد پشت‌سرهم‌اند.'],s:'فاصله‌ها 3، 5، 7، 9 هستند و بعدی 11 است. پس 27 + 11 = 38.'},\n{c:'الگو',d:2,q:'عدد بعدی چیست؟\u003cbr>\u003cspan dir=\"ltr\" class=\"seq\">2, 3, 5, 9, 17, ?\u003c/span>',o:['25','31','33','35'],a:2,h:['فاصله‌ی جمله‌ها را حساب کن.','فاصله‌ها هر بار دو برابر می‌شوند.'],s:'فاصله‌ها 1، 2، 4، 8 هستند و بعدی 16 است. پس 17 + 16 = 33.'},\n{c:'الگو',d:2,q:'عدد بعدی چیست؟\u003cbr>\u003cspan dir=\"ltr\" class=\"seq\">1, 2, 6, 24, 120, ?\u003c/span>',o:['240','480','600','720'],a:3,h:['هر جمله را به جمله‌ی قبل تقسیم کن.'],s:'ضریب‌ها 2، 3، 4 و 5 هستند، پس ضریب بعدی 6 است: 120 × 6 = 720.'},\n{c:'منطق',d:1,q:'اگر همه‌ی A ها B باشند و همه‌ی B ها C باشند، کدام جمله حتماً درست است؟',o:['همه‌ی C ها A هستند','همه‌ی A ها C هستند','بعضی C ها B نیستند','هیچ A ای C نیست'],a:1,h:['یک نمودار با دایره‌های تو در تو بکش.'],s:'A داخل B است و B داخل C، پس A داخل C است. جمله‌ی دیگر لزوماً درست نیست.'},\n{c:'منطق',d:1,q:'سارا از مریم بلندتر است. مریم از نیما بلندتر است. آرش از سارا بلندتر است. کدام نفر کوتاه‌ترین است؟',o:['سارا','مریم','آرش','نیما'],a:3,h:['افراد را از بلند به کوتاه مرتب کن.'],s:'ترتیب از بلند به کوتاه: آرش، سارا، مریم، نیما. پس نیما کوتاه‌ترین است.'},\n{c:'منطق',d:2,q:'هر آدم یا همیشه راست می‌گوید یا همیشه دروغ. الف می‌گوید: «دست‌کم یکی از ما دروغ‌گوست.» ب می‌گوید: «الف دروغ می‌گوید.» وضعیت آن‌ها چیست؟',o:['هر دو راست‌گو','الف راست‌گو و ب دروغ‌گو','الف دروغ‌گو و ب راست‌گو','هر دو دروغ‌گو'],a:1,h:['فرض کن الف دروغ‌گوست و ببین به تناقض می‌رسی یا نه.','اگر جمله‌ی الف دروغ باشد، یعنی هیچ‌کدام دروغ‌گو نیستند.'],s:'اگر الف دروغ‌گو باشد، جمله‌اش باید نادرست باشد، یعنی هیچ‌کس دروغ‌گو نیست، که با دروغ‌گو بودن الف تناقض دارد. پس الف راست‌گوست و جمله‌اش درست است: ب دروغ‌گوست. این با گفته‌ی ب هم می‌خواند، چون ب دروغ می‌گوید.'},\n{c:'منطق',d:2,q:'امروز سه‌شنبه است. 100 روز بعد چه روزی است؟',o:['چهارشنبه','پنج‌شنبه','جمعه','شنبه'],a:1,h:['هفته 7 روز دارد. باقی‌مانده‌ی 100 بر 7 را حساب کن.'],s:'100 = 14 × 7 + 2، پس 2 روز بعد از سه‌شنبه می‌شود پنج‌شنبه.'},\n{c:'احتمال',d:2,q:'دو تاس سالم می‌اندازیم. احتمال اینکه مجموع آن‌ها 7 شود چقدر است؟',o:['1/12','1/6','1/9','7/36'],a:1,h:['همه‌ی حالت‌ها 36 تاست. حالت‌های مطلوب را بشمار.'],s:'حالت‌های مجموع 7: (1,6)، (2,5)، (3,4)، (4,3)، (5,2)، (6,1)، یعنی 6 حالت از 36. احتمال 6/36 = 1/6.'},\n{c:'احتمال',d:2,q:'یک سکه‌ی سالم را سه بار می‌اندازیم. احتمال اینکه دقیقاً دو بار شیر بیاید چقدر است؟',o:['1/4','1/8','1/2','3/8'],a:3,h:['همه‌ی حالت‌ها 8 تاست. حالت‌های دقیقاً دو شیر را فهرست کن.'],s:'حالت‌های مطلوب: ش‌ش‌خ، ش‌خ‌ش، خ‌ش‌ش یعنی 3 حالت از 8. احتمال 3/8.'},\n{c:'احتمال',d:1,q:'به چند طریق می‌شود سه نفر را در یک صف قرار داد؟',o:['3','6','9','12'],a:1,h:['برای جای اول چند انتخاب داری؟ بعد برای جای دوم؟'],s:'3 × 2 × 1 = 6 حالت.'},\n{c:'احتمال',d:1,q:'از 5 نفر چند کمیته‌ی دو نفره می‌توان ساخت؟',o:['5','10','20','25'],a:1,h:['اگر ترتیب مهم نبود، هر زوج را فقط یک بار بشمار.'],s:'تعداد انتخاب‌های ترتیب‌دار 5 × 4 = 20 است و هر زوج دو بار شمرده شده. پس 20 ÷ 2 = 10.'},\n{c:'ناقص',d:3,q:'سه جعبه با برچسب‌های «سیب»، «پرتقال» و «مخلوط» داری و می‌دانی همه‌ی برچسب‌ها غلط‌اند. از جعبه‌ی «مخلوط» یک میوه بیرون می‌آوری و سیب است. جعبه‌ی «پرتقال» چه چیزی دارد؟',o:['سیب','پرتقال','مخلوط','معلوم نمی‌شود'],a:2,h:['جعبه‌ی «مخلوط» برچسب غلط دارد، پس واقعاً چه محتوایی دارد؟','حالا برای جعبه‌ی «پرتقال» فقط دو محتوا باقی می‌ماند.'],s:'برچسب «مخلوط» غلط است و سیب بیرون آمده، پس آن جعبه فقط سیب دارد. جعبه‌ی «پرتقال» نه پرتقال دارد (برچسبش غلط است) و نه سیب (سیب در جعبه‌ی دیگر است)، پس مخلوط دارد.'},\n{c:'چندمرحله',d:1,q:'عددی را در 3 ضرب می‌کنم، 4 تا کم می‌کنم و بر 2 تقسیم می‌کنم. حاصل 10 می‌شود. عدد اولیه چند بود؟',o:['6','8','9','10'],a:1,h:['از آخر به اول برگرد و هر عمل را معکوس کن.'],s:'از آخر: 10 × 2 = 20، 20 + 4 = 24، 24 ÷ 3 = 8. بررسی: 8 × 3 = 24، 24 − 4 = 20، 20 ÷ 2 = 10.'},\n{c:'چندمرحله',d:2,q:'پدری 30 سال از پسرش بزرگ‌تر است. 5 سال پیش سن پدر 4 برابر سن پسر بود. پسر الان چند ساله است؟',o:['10','12','15','20'],a:2,h:['سن پسر را x بگیر و سن پدر الان و 5 سال پیش را بر حسب x بنویس.','معادله: x + 25 = 4(x − 5).'],s:'x + 25 = 4x − 20، پس 3x = 45 و x = 15. پدر 45 ساله است. 5 سال پیش 40 و 10 بودند و 40 = 4 × 10.'},\n{c:'چندمرحله',d:2,q:'در کلاسی 30 نفره، 18 نفر فوتبال و 15 نفر والیبال بازی می‌کنند و 5 نفر هیچ‌کدام. چند نفر هر دو ورزش را بازی می‌کنند؟',o:['3','6','8','10'],a:2,h:['اول بشمار چند نفر دست‌کم یک ورزش بازی می‌کنند.'],s:'30 − 5 = 25 نفر دست‌کم یکی را بازی می‌کنند. چون 18 + 15 = 33، تعداد 33 − 25 = 8 نفر دو بار شمرده شده‌اند، پس 8 نفر هر دو را بازی می‌کنند.'}\n];\nP.forEach(function(p,i){p.id=i});\nvar st=ls('st',{done:{},hist:[],mark:{}}),mode='pz',cur=-1,hint=0,tried=false,shown=false,right=-1,wrong={};\nfunction save(){sv('st',st)}\nfunction flt(){var c=$('#fc').value,d=$('#fd').value;return P.filter(function(p){return(c==='all'||p.c===c)&&(d==='all'||p.d===+d)})}\nfunction pick(){var L=flt();if(!L.length){cur=-1;draw();return}var U=L.filter(function(p){return !st.done[p.id]&&p.id!==cur}),A=U.length?U:L.filter(function(p){return p.id!==cur});if(!A.length)A=L;\n cur=A[Math.floor(Math.random()*A.length)].id;reset()}\nfunction daily(){var d=new Date();cur=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)%P.length;reset()}\nfunction reset(){hint=0;tried=false;shown=false;right=-1;wrong={};draw()}\nfunction dots(n){return '●'.repeat(n)+'○'.repeat(3-n)}\nfunction draw(){\n if(cur\u003c0){$('#pc').innerHTML='\u003cdiv class=\"card\">\u003cdiv class=\"empty\">معمایی با این فیلتر پیدا نشد. دسته یا سطح را عوض کن.\u003c/div>\u003c/div>';return}\n var p=P[cur],h='\u003cdiv class=\"card\">\u003cdiv class=\"sub\" style=\"display:flex;justify-content:space-between\">\u003cspan>'+(mode==='dy'?'چالش امروز · ':'')+p.c+'\u003c/span>\u003cspan>'+dots(p.d)+(st.done[p.id]?' · حل‌شده':'')+'\u003c/span>\u003c/div>\u003cdiv class=\"q\">'+p.q+'\u003c/div>\u003cdiv id=\"ops\">';\n p.o.forEach(function(o,i){h+='\u003cbutton class=\"opt'+(right===i?' ok':'')+(wrong[i]?' no':'')+'\" data-i=\"'+i+'\"'+(right>=0||shown?' disabled':'')+'>'+o+'\u003c/button>'});\n h+='\u003c/div>\u003cdiv class=\"msg'+(right\u003c0&&tried?' err':'')+'\" role=\"status\">'+(right>=0?'درسته! آفرین.':(tried&&!shown?'این نبود. دوباره فکر کن یا راهنما بگیر.':''))+'\u003c/div>';\n if(hint){h+='\u003cdiv class=\"hints\">'+p.h.slice(0,hint).map(function(t,i){return '\u003cdiv>راهنما '+(i+1)+': '+t+'\u003c/div>'}).join('')+'\u003c/div>'}\n if(right>=0||shown){h+='\u003cdiv class=\"hints sol\">\u003cb>پاسخ: '+p.o[p.a]+'\u003c/b>\u003cdiv>'+p.s+'\u003c/div>\u003c/div>'}\n h+='\u003cdiv class=\"row gap\">\u003cbutton id=\"hb\"'+(hint>=p.h.length||right>=0||shown?' disabled':'')+'>راهنما'+(hint\u003cp.h.length?' ('+(p.h.length-hint)+')':'')+'\u003c/button>\u003cbutton id=\"sb\"'+(!tried||right>=0||shown?' disabled':'')+'>نمایش پاسخ\u003c/button>\u003c/div>';\n h+='\u003cdiv class=\"row gap\">\u003cbutton id=\"mb\">'+(st.mark[p.id]?'برداشتن علامت':'علامت برای بعد')+'\u003c/button>'+(mode==='pz'?'\u003cbutton class=\"pri\" id=\"nb\">معمای بعدی\u003c/button>':'')+'\u003c/div>\u003c/div>';\n $('#pc').innerHTML=h;\n $$('.opt').forEach(function(b){b.onclick=function(){var i=+b.dataset.i;tried=true;var ok=i===p.a;st.hist.push({id:p.id,ok:ok,at:Date.now()});if(st.hist.length>300)st.hist.shift();\n  if(ok){right=i;st.done[p.id]=true}else wrong[i]=true;save();draw()}});\n $('#hb').onclick=function(){hint++;draw()};$('#sb').onclick=function(){shown=true;draw()};\n $('#mb').onclick=function(){if(st.mark[p.id])delete st.mark[p.id];else st.mark[p.id]=1;save();draw()};\n if($('#nb'))$('#nb').onclick=pick}\nfunction prog(){var n=Object.keys(st.done).length,at=st.hist.length,ok=st.hist.filter(function(x){return x.ok}).length,h='\u003cdiv class=\"card\">\u003ch2>آمار شخصی\u003c/h2>\u003cdiv class=\"sub\">حل‌شده: \u003cb style=\"color:var(--tx)\">'+n+'\u003c/b> از '+P.length+' معما\u003cbr>تلاش‌ها: '+at+(at?' | درستی: '+Math.round(ok/at*100)+'٪':'')+'\u003c/div>\u003cdiv class=\"chips gap\">';\n ['منطق','الگو','احتمال','ناقص','چندمرحله'].forEa c/script>\n\u003c/body>\n\u003c/html>\n","oracle":"\u003c!DOCTYPE html>\n\u003chtml lang=\"fa\" dir=\"rtl\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003cmeta name=\"theme-color\" content=\"#080D18\">\n\u003ctitle>PRISM ORACLE\u003c/title>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700&display=swap\">\n\u003cstyle>\n:root{--bg:#080D18;--sur:#111B2B;--glass:rgba(201,228,255,.08);--bd:rgba(255,255,255,.15);--pri:#8CCBFF;--sec:#A99BFF;--acc:#79E3D0;--tx:#F4F7FC;--tx2:#AAB7C8;--on:#080D18;--sh:0 10px 30px rgba(0,0,0,.35);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:light){:root:not([data-theme=\"dark\"]){--bg:#F1F5FA;--sur:#FFFFFF;--glass:rgba(255,255,255,.65);--bd:rgba(21,32,51,.12);--pri:#397FC2;--sec:#7467C8;--acc:#268F83;--tx:#152033;--tx2:#64748B;--on:#FFFFFF;--sh:0 10px 30px rgba(21,32,51,.1);color-scheme:light}}\n:root[data-theme=\"light\"]{--bg:#F1F5FA;--sur:#FFFFFF;--glass:rgba(255,255,255,.65);--bd:rgba(21,32,51,.12);--pri:#397FC2;--sec:#7467C8;--acc:#268F83;--tx:#152033;--tx2:#64748B;--on:#FFFFFF;--sh:0 10px 30px rgba(21,32,51,.1);color-scheme:light}\n:root:root:root{--pri:var(--sec)}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nbody{margin:0;min-height:100%;background:radial-gradient(500px 360px at 85% -5%,color-mix(in srgb,var(--sec) 30%,transparent),transparent),radial-gradient(520px 380px at 0% 30%,color-mix(in srgb,var(--pri) 22%,transparent),transparent),var(--bg);background-attachment:fixed;color:var(--tx);font-family:\"Vazirmatn\",Tahoma,sans-serif;padding:0 16px 96px}\nheader{max-width:480px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:16px 2px 8px}\nh on:ltr}\n.ck{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}.ck input{width:20px;height:20px;accent-color:var(--pri)}\n.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{min-height:38px;padding:0 12px;font-size:13px;border-radius:14px}.chip.on{background:var(--pri);color:var(--on);border-color:transparent;font-weight:700}\n.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--bd)}.item:first-child{border-top:0}\n.item b{font-weight:500}.item small{display:block;color:var(--tx2)}\n.x{min-height:40px;width:40px;padding:0;flex:0 0 40px;color:var(--tx2)}\n.empty{color:var(--tx2);text-align:center;padding:14px 0;font-size:14px;line-height:1.9}\n.msg{min-height:22px;text-align:center;color:var(--acc);font-size:14px;margin:4px 0}.msg.err{color:#ff8f8f}\nnav{position:fixed;inset:auto 0 0 0;padding:0 14px calc(10px + env(safe-area-inset-bottom,0px))}\nnav div{max-width:480px;margin:0 auto;display:flex;gap:4px;background:var(--glass);border:1px solid var(--bd);border-radius:22px;padding:5px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--sh)}\nnav button{flex:1;border:0;background:none;min-height:46px;padding:0 2px;font-size:12.5px;color:var(--tx2);border-radius:17px}\nnav button.on{background:var(--pri);color:var(--on);font-weight:700}\n.hid{display:none!important}\n.orb{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--pri) 45%,#17305a);box-shadow:0 0 16px var(--pri)}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\u003ch1>\u003cspan class=\"orb\">\u003c/span>PRISM ORACLE\u003c/h1>\u003cbutton class=\"x\" id=\"theme\" aria-label=\"تغییر تم روشن و تاریک\">◐\u003c/button>\u003c/header>\n\u003cmain>\n\n\u003cdiv class=\"card\" style=\"display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px\">\u003cspan class=\"sub\" style=\"font-size:13px\">ابزارهای محلی: فعال\u003c/span>\u003cspan id=\"net\" class=\"chip\" style=\"display:inline-flex;align-items:center;border:1px solid var(--bd);min-height:30px\">\u003c/span>\u003c/div>\n\u003csection class=\"tab on\" id=\"txt\">\n \u003cdiv class=\"card\">\u003ctextarea id=\"tx\" rows=\"11\" placeholder=\"متنت را اینجا بنویس یا بچسبان. هر تغییر خودکار روی همین دستگاه ذخیره می‌شود.\" aria-label=\"متن\">\u003c/textarea>\n  \u003cdiv class=\"row gap\">\u003cbutton id=\"cp\">کپی متن\u003c/button>\u003cbutton id=\"cl\">پاک‌کردن\u003c/button>\u003c/div>\u003cdiv class=\"msg\" id=\"cm\" role=\"status\">\u003c/div>\u003c/div>\n \u003cdiv class=\"card\">\u003ch2>آمار متن\u003c/h2>\u003cdiv id=\"st\" class=\"row\" style=\"flex-wrap:wrap\">\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection class=\"tab\" id=\"ana\">\n \u003cdiv class=\"card\">\u003ch2>کلمات کلیدی\u003c/h2>\u003cdiv class=\"chips\" id=\"kw\">\u003c/div>\u003c/div>\n \u003cdiv class=\"card\">\u003ch2>خلاصه‌ی استخراجی\u003c/h2>\n  \u003clabel class=\"lb\" for=\"sn\">\u003cspan>تعداد جمله‌ها\u003c/span>\u003cb id=\"sno\">3\u003c/b>\u003c/label>\u003cinput type=\"range\" id=\"sn\" min=\"1\" max=\"6\" step=\"1\" value=\"3\">\n  \u003cdiv class=\"row gap\">\u003cbutton class=\"pri\" id=\"sg\">استخراج خلاصه\u003c/button>\u003c/div>\n  \u003cdiv id=\"sm\" class=\"sub\" style=\"margin-top:10px;color:var(--tx)\">\u003c/div>\n  \u003cdiv class=\"sub\" style=\"font-size:12px;margin-top:8px\">این ابزار مهم‌ترین جمله‌های خود متن را انتخاب می‌کند و چیزی را بازنویسی نمی‌کند.\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection class=\"tab\" id=\"fmt\">\u003cdiv class=\"card\">\u003ch2>قالب‌بندی متن\u003c/h2>\u003cdiv class=\"chips\" id=\"fb\">\u003c/div>\u003cdiv class=\"row gap\">\u003cbutton id=\"un\" disabled>برگرداندن آخرین تغییر\u003c/button>\u003c/div>\u003cdiv class=\"msg\" id=\"fm\" role=\"status\">\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"tab\" id=\"his\">\u003cdiv class=\"card\">\u003cdiv class=\"row\">\u003cinput id=\"hn\" placeholder=\"نام نسخه (اختیاری)\" aria-label=\"نام نسخه\">\u003cbutton class=\"pri\" id=\"hs\" style=\"flex:0 0 auto\">ذخیره‌ی نسخه\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"card\" id=\"hl\">\u003c/div>\u003c/section>\n\u003csection class=\"tab\" id=\"set\">\u003cdiv class=\"card\">\u003ch2>اتصال به هوش مصنوعی آنلاین\u003c/h2>\n \u003cdiv class=\"sub\">\u003cb style=\"color:var(--tx)\">وضعیت: غیرفعال در نسخه‌ی وب\u003c/b>\u003cbr>پرسش و پاسخ، خلاصه‌سازی پیشرفته و بازنویسی با لحن به اتصال به یک سرویس بیرونی نیاز دارند. صفحه‌ی منتشرشده اجازه‌ی ارسال درخواست به سرویس‌های دیگر را ندارد، برای همین این بخش را نساخته‌ام تا دکمه‌ی بی‌اثر نداشته باشی.\u003c/div>\n \u003cdiv class=\"sub gap\">در نسخه‌ی اپ اندروید قرار است کاربر خودش سرویس و کلید را وارد کند. کلید فقط روی دستگاه می‌ماند و متن بدون تأیید روشن تو به هیچ سرویسی فرستاده نمی‌شود.\u003c/div>\n \u003cdiv class=\"sub gap\">همه‌ی ابزارهای این صفحه روی دستگاه خودت اجرا می‌شوند و چیزی به جایی ارسال نمی‌شود.\u003c/div>\u003c/div>\u003c/section>\n\n\u003c/main>\n\u003cnav>\u003cdiv role=\"tablist\">\u003cbutton class=\"on\" data-t=\"txt\">متن\u003c/button>\u003cbutton data-t=\"ana\">تحلیل\u003c/button>\u003cbutton data-t=\"fmt\">قالب\u003c/button>\u003cbutton data-t=\"his\">نسخه‌ها\u003c/button>\u003cbutton data-t=\"set\">اتصال\u003c/button>\u003c/div>\u003c/nav>\n\u003cscript>\nvar K='prism-oracle-';\n\nvar $=function(s){return document.querySelector(s)},$$=function(s){return document.querySelectorAll(s)};\nfunction ls(k,d){try{var v=localStorage.getItem(K+k);return v?JSON.parse(v):d}catch(e){return d}}\nfunction sv(k,v){try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){}}\nfunction p2(n){return(n\u003c10?'0':'')+n}\nfunction esc(s){return String(s).replace(/[&\u003c>\"]/g,function(c){return{'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}\nvar t0=ls('theme',null);if(t0)document.documentElement.dataset.theme=t0;\n$('#theme').onclick=function(){var r=document.documentElement,c=r.dataset.theme||(m tio(pr);stMat.uniforms.uPx.value=pr;resize()}acc=0;fc=0}\n}catch(err){if(++errs>3){fail('A rendering error occurred:\u003cbr>'+String(err.message||err)+'\u003cbr>\u003cbr>Try reloading the page.');console.error(err)}}}\nresetAll();spawn=0;tD=dist=defCam()*1.15;requestAnimationFrame(loop);\n})();\n\u003c/script>\n\u003c/body>\u003c/html>\n","rainbow":"\u003c!DOCTYPE html>\n\u003chtml lang=\"fa\" dir=\"rtl\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n\u003ctitle>پازل رنگین‌کمان\u003c/title>\n\u003cstyle>\n  * { margin:0; padding:0; box-sizing:border-box; }\n  body {\n    font-family: 'Segoe UI', Tahoma, sans-serif;\n    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);\n    min-height: 100vh;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    justify-content: center;\n    color: #fff;\n    overflow: hidden;\n  }\n  h1 {\n    font-size: 2.2rem;\n    margin-bottom: 10px;\n    background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);\n    -webkit-background-clip: text;\n    -webkit-text-fill-color: transparent;\n    text-shadow: 0 0 30px rgba(255,255,255,0.1);\n  }\n  .info {\n    display: flex;\n    gap: 30px;\n    margin-bottom: 20px;\n    font-size: 1.1rem;\n  }\n  .info span { color: #feca57; font-weight: bold; }\n  #board {\n    display: grid;\n    grid-template-columns: repeat(4, 90px);\n    grid-template-rows: repeat(4, 90px);\n    gap: 8px;\n    background: rgba(255,255,255,0.05);\n    padding: 15px;\n    border-radius: 20px;\n    box-shadow: 0 20px 60px rgba(0,0,0,0.5);\n  }\n  .tile {\n    border-radius: 12px;\n    cursor: pointer;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 2rem;\n    font-weight: bold;\n    transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);\n    box-shadow: 0 4px 15px rgba(0,0,0,0.3);\n    user-select: none;\n  }\n  .tile:hover { transform: scale(1.08); }\n  .tile.empty {\n    background: transparent;\n    box-shadow: inset 0 0 20px rgba(255,255,255,0.05);\n    cursor: default;\n  }\n  .tile.empty:hover { transform: none; }\n  .controls { margin-top: 25px; display: flex; gap: 15px; }\n  button {\n    padding: 12px 30px;\n    font-size: 1rem;\n    font-family: inherit;\n    border: none;\n    border-radius: 50px;\n    cursor: pointer;\n    font-weight: bold;\n    transition: all 0.3s;\n  }\n  .btn-shuffle {\n    background: linear-gradient(90deg, #ff6b6b, #ee5253);\n    color: white;\n    box-shadow: 0 5px 20px rgba(238,82,83,0.4);\n  }\n  .btn-shuffle:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(238,82,83,0.6); }\n  .btn-hint {\n    background: linear-gradient(90deg, #48dbfb, #0abde3);\n    color: #1a1a2e;\n    box-shadow: 0 5px 20px rgba(72,219,251,0.4);\n  }\n  .btn-hint:hover { transform: translateY(-3px); }\n  #message {\n    margin-top: 20px;\n    font-size: 1.3rem;\n    color: #2ecc71;\n    font-weight: bold;\n    opacity: 0;\n    transition: opacity 0.5s;\n    text-shadow: 0 0 20px rgba(46,204,113,0.5);\n  }\n  .confetti {\n    position: fixed;\n    width: 10px;\n    height: 10px;\n    pointer-events: none;\n    z-index: 1000;\n  }\n  @media (max-width: 500px) {\n    #board { grid-template-columns: repeat(4, 70px); grid-template-rows: repeat(4, 70px); }\n    .tile { font-size: 1.5rem; }\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003ch1>🧩 پازل رنگین‌کمان\u003c/h1>\n\u003cdiv class=\"info\">\n  \u003cdiv>حرکات: \u003cspan id=\"moves\">0\u003c/span>\u003c/div>\n  \u003cdiv>زمان: \u003cspan id=\"timer\">0\u003c/span> ثانیه\u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"board\">\u003c/div>\n\n\u003cdiv class=\"controls\">\n  \u003cbutton class=\"btn-shuffle\" onclick=\"shuffle()\">🔀 مخلوط کن\u003c/button>\n  \u003cbutton class=\"btn-hint\" onclick=\"showHint()\">💡 راهنما\u003c/button>\n\u003c/div>\n\n\u003cdiv id=\"message\">🎉 آفرین! پازل را حل کردی!\u003c/div>\n\n\u003cscript>\nconst SIZE = 4;\nconst TOTAL = SIZE * SIZE;\nlet tiles = [];\nlet moves = 0;\nlet seconds = 0;\nlet timerInterval = null;\nlet gameStarted = false;\n\n// رنگ‌های گرادیانتی برای هر خانه\nconst colors = [\n  '#ff6b6b','#ff9e7d','#feca57','#48dbfb',\n  '#1dd1a1','#ff9ff3','#54a0ff','#5f27cd',\n  '#ff6348','#2ed573','#eccc68','#7d5fff',\n  '#ff4757','#3742fa','#2f3542','#a4b0be'\n];\n\nfunction init() {\n  tiles = Array.from({length: TOTAL}, (_, i) => i === TOTAL - 1 ? 0 : i + 1);\n  moves = 0;\n  seconds = 0;\n  gameStarted = false;\n  clearInterval(timerInterval);\n  document.getElementById('moves').textContent = '0';\n  document.getElementById('timer').textContent = '0';\n  document.getElementById('message').style.opacity = '0';\n  render();\n}\n\nfunction render() {\n  const board = document.getElementById('board');\n  board.innerHTML = '';\n  tiles.forEach((num, idx) => {\n    const div = document.createElement('div');\n    div.className = 'tile' + (num === 0 ? ' empty' : '');\n    if (num !== 0) {\n      div.textContent = num;\n      div.style.background = `linear-gradient(135deg, ${colors[(num-1) % colors.length]}, ${colors[num % colors.length]})`;\n      div.onclick = () => moveTile(idx);\n    }\n    board.appendChild(div);\n  });\n}\n\nfunction moveTile(idx) {\n  const emptyIdx = tiles.indexOf(0);\n  const row = Math.floor(idx / SIZE), col = idx % SIZE;\n  const eRow = Math.floor(emptyIdx / SIZE), eCol = emptyIdx % SIZE;\n\n  // فقط خانه‌های مجاور قابل حرکتند\n  if ((Math.abs(row - eRow) === 1 && col === eCol) ||\n      (Math.abs(col - eCol) === 1 && row === eRow)) {\n\n    if (!gameStarted) {\n      gameStarted = true;\n      timerInterval = setInterval(() => {\n        seconds++;\n        document.getElementById('timer').textContent = seconds;\n      }, 1000);\n    }\n\n    [tiles[idx], tiles[emptyIdx]] = [tiles[emptyIdx], tiles[idx]];\n    moves++;\n    document.getElementById('moves').textContent = moves;\n    render();\n    checkWin();\n  }\n}\n\nfunction shuffle() {\n  // الگوریتم Fisher-Yates برای مخلوط‌کردن واقعی\n  for (let i = tiles.length - 1; i > 0; i--) {\n    const j = Math.floor(Math.random() * (i + 1));\n    [tiles[i], tiles[j]] = [tiles[j], tiles[i]];\n  }\n  // تضمین اینکه پازل قابل حل باشد\n  if (!isSolvable()) {\n    // تعویض دو خانه غیر خالی\n    const idx1 = tiles.findIndex(t => t !== 0);\n    const idx2 = tiles.findIndex((t, i) => t !== 0 && i !== idx1);\n    [tiles[idx1], tiles[idx2]] = [tiles[idx2], tiles[idx1]];\n  }\n  moves = 0;\n  seconds = 0;\n  gameStarted = false;\n  clearInterval(timerInterval);\n  document.getElementById('moves').textContent = '0';\n  document.getElementById('timer').textContent = '0';\n  document.getElementById('message').style.opacity = '0';\n  render();\n}\n\nfunction isSolvable() {\n  let inversions = 0;\n  const arr = tiles.filter(t => t !== 0);\n  for (let i = 0; i \u003c arr.length; i++) {\n    for (let j = i + 1; j \u003c arr.length; j++) {\n      if (arr[i] > arr[j]) inversions++;\n    }\n  }\n  const emptyRow = Math.floor(tiles.indexOf(0) / SIZE);\n  return (inversions + emptyRow) % 2 === 0;\n}\n\nfunction showHint() {\n  const emptyIdx = tiles.indexOf(0);\n  const eRow = Math.floor(emptyIdx / SIZE), eCol = emptyIdx % SIZE;\n  const neighbors = [];\n  if (eRow > 0) neighbors.push(emptyIdx - SIZE);\n  if (eRow \u003c SIZE - 1) neighbors.push(emptyIdx + SIZE);\n  if (eCol > 0) neighbors.push(emptyIdx - 1);\n  if (eCol \u003c SIZE - 1) neighbors.push(emptyIdx + 1);\n\n  // پیدا کردن خانه‌ای که باید جای خالی باشد\n  const correct = neighbors.find(i => tiles[i] === i + 1);\n  const target = correct !== undefined ? correct : neighbors[0];\n\n  const tileDivs = document.querySelectorAll('.tile');\n  tileDivs[target].style.transform = 'scale(1.15)';\n  tileDivs[target].style.boxShadow = '0 0 30px rgba(255,255,255,0.8)';\n  setTimeout(() => {\n    tileDivs[target].style.transform = '';\n    tileDivs[target].style.boxShadow = '';\n  }, 800);\n}\n\nfunction checkWin() {\n  for (let i = 0; i \u003c TOTAL - 1; i++) {\n    if (tiles[i] !== i + 1) return;\n  }\n  clearInterval(timerInterval);\n  document.getElementById('message').style.opacity = '1';\n  createConfetti();\n}\n\nfunction createConfetti() {\n  const colorsConf = ['#ff6b6b','#feca57','#48dbfb','#2ecc71','#ff9ff3'];\n  for (let i = 0; i \u003c 100; i++) {\n    setTimeout(() => {\n      const c = document.createElement('div');\n      c.className = 'confetti';\n      c.style.background = colorsConf[Math.floor(Math.random() * colorsConf.length)];\n      c.style.left = Math.random() * 100 + 'vw';\n      c.style.top = '-10px';\n      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';\n      document.body.appendChild(c);\n      const duration = 2000 + Math.random() * 2000;\n      c.animate([\n        { transform: 'translateY(0) rotate(0deg)', opacity: 1 },\n        { transform: `translateY(100vh) rotate(${Math.random() * 720}deg)`, opacity: 0 }\n      ], { duration, easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)' });\n      setTimeout(() => c.remove(), duration);\n    }, i * 20);\n  }\n}\n\n// شروع بازی\ninit();\n// مخلوط‌کردن خودکار در بارگذاری\nsetTimeout(shuffle, 500);\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n"}</script>
